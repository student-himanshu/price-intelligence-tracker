[project]
name = "price-intelligence-tracker"
version = "0.1.0"
description = "A portfolio-grade price intelligence system for collecting, normalizing, analyzing, and forecasting product prices."
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
    { name = "Himanshu Mishra" }
]

dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "fastapi>=0.115,<1.0",
    "mysql-connector-python>=9.0,<10.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "plotly>=5.24,<7.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
    "rapidfuzz>=3.10,<4.0",
    "scikit-learn>=1.5,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "streamlit>=1.40,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
    "groq>=0.11,<1.0",
    "google-genai>=1.0,<2.0",
    "alembic>=1.19.1",
]

[project.scripts]
price-tracker = "price_tracker.cli.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
